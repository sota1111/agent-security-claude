name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q attack.py scripts
      - run: python scripts/test_exec_compat.py
      - run: python scripts/test_score_real_agent.py
      - run: python scripts/test_screen_transfer_candidates.py
